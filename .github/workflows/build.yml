# .github/workflows/build.yml
#
# Build WrtWeb as both .ipk (OpenWrt 23.05) and .apk (OpenWrt 24.10+) across
# several common targets. The SDK download filename is auto-discovered from the
# target directory listing (OpenWrt does not publish stable .sh.x installers
# for every target).

name: Build WrtWeb packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.fmt }} (${{ matrix.name }})
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # ipk builds (opkg, OpenWrt <= 23.05)
          - fmt: ipk
            name: 23.05-x86_64
            release: "23.05.5"
            target: "x86/64"
            arch: "x86_64"
          - fmt: ipk
            name: 23.05-mipsel_24kc
            release: "23.05.5"
            target: "ramips/mt7621"
            arch: "mipsel_24kc"
          # apk builds (apk, OpenWrt >= 24.10)
          - fmt: apk
            name: 24.10-filogic
            release: "24.10.1"
            target: "mediatek/filogic"
            arch: "aarch64_cortex-a53"
          - fmt: apk
            name: 24.10-x86_64
            release: "24.10.1"
            target: "x86/64"
            arch: "x86_64"

    steps:
      - uses: actions/checkout@v4
        with:
          path: src-package

      - name: Discover + download SDK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}"
          FILE=$(curl -sL "$BASE/" | grep -oE 'openwrt-sdk-[^"]+\.(tar\.xz|tar\.zst)' | head -n1)
          echo "SDK file: $FILE"
          curl -Ls "$BASE/$FILE" -o sdk.dl
          case "$FILE" in
            *.tar.zst) tar --zstd -xf sdk.dl ;;
            *.tar.xz)  tar xf sdk.dl ;;
          esac
          mv openwrt-sdk-* "$HOME/sdk"
          ls "$HOME/sdk"

      - name: Place package
        run: |
          mkdir -p "$HOME/sdk/package/wrtweb"
          cp -r src-package/. "$HOME/sdk/package/wrtweb/"
          rm -rf "$HOME/sdk/package/wrtweb/.github"

      - name: Update feeds
        run: |
          cd "$HOME/sdk"
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p luci || true

      - name: Select config
        run: |
          cd "$HOME/sdk"
          # Install LuCI feed packages so dependency tree resolves
          ./scripts/feeds update -a || true
          ./scripts/feeds install luci || true
          cat >> .config <<'CFG'
          CONFIG_PACKAGE_wrtweb=y
          CFG
          make defconfig

      - name: Compile wrtweb
        run: |
          cd "$HOME/sdk"
          make package/wrtweb/compile V=s

      - name: Collect artifacts
        run: |
          cd "$HOME/sdk"
          find bin/packages -name 'wrtweb*.${{ matrix.fmt }}' -exec cp {} "$GITHUB_WORKSPACE/" \;

      - name: Show artifacts
        run: ls -la "$GITHUB_WORKSPACE"/*.${{ matrix.fmt }} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtweb-${{ matrix.fmt }}-${{ matrix.name }}
          path: ${{ github.workspace }}/wrtweb*.${{ matrix.fmt }}
